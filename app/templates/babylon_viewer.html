<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Babylon.js Viewer</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <style>
        #renderCanvas {
            width: 100%;
            height: 300px;
            touch-action: none;
        }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true);

        const createScene = async function() {
            const scene = new BABYLON.Scene(engine);
            const camera = new BABYLON.ArcRotateCamera("camera", 0, Math.PI / 3, 10, BABYLON.Vector3.Zero(), scene);
            camera.attachControl(canvas, true);
            const light = new BABYLON.HemisphericLight("light", new BABYLON.Vector3(0, 1, 0), scene);
           
            try {
                // Load the GLB model
                const result = await BABYLON.SceneLoader.ImportMeshAsync("", 
                    "https://forge-projects.s3.amazonaws.com/projects/", 
                    "model.glb", 
                    scene
                );
                
                // Scale up the model
                const modelScale = 5.0;
                result.meshes[0].scaling = new BABYLON.Vector3(modelScale, modelScale, modelScale);
            } catch (error) {
                console.error("Error loading model:", error);
            }

            return scene;
           
        }

        createScene().then((scene) => {
            engine.runRenderLoop(function () {
                scene.render();
            });
        });

        window.addEventListener("resize", function () {
            engine.resize();
        });
    </script>
</body>
</html>
